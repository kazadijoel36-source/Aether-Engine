<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Engine | Tactical File Transmutation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google AdSense Code Placeholder -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <div class="logo">AETHER // ENGINE</div>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/terms">Terms</a>
        </nav>
    </header>

    <main class="container">
        <section class="engine-bay">
            <div class="tool-card">
                <h2>Unified Transmuter</h2>
                <p>Load your file first, then select the target conversion type.</p>

                <form action="/convert" method="post" enctype="multipart/form-data" id="conversion-form">
                    
                    <!-- STAGE 1: LOAD FILE -->
                    <div class="step-box">
                        <label for="file-upload" class="step-label">01 // LOAD MATTER</label>
                        <div class="custom-file-input">
                            <input type="file" name="file" id="file-upload" required>
                        </div>
                    </div>

                    <div class="step-divider"></div>

                    <!-- STAGE 2: SELECT STATE -->
                    <div class="step-box">
                        <label for="conversion-type" class="step-label">02 // SELECT TARGET STATE</label>
                        <select name="conversion_type" id="conversion-type" class="tactical-select" required>
                            <option value="" disabled selected>Select Transformation...</option>
                            <optgroup label="PDF Tools">
                                <option value="pdf_to_word">PDF to Word (.docx)</option>
                                <option value="pdf_to_img">PDF to Image (.zip)</option>
                                <option value="merge_pdf">Merge Multiple PDFs</option>
                            </optgroup>
                            <optgroup label="Image Tools">
                                <option value="png_to_jpg">PNG to JPG</option>
                                <option value="jpg_to_png">JPG to PNG</option>
                                <option value="compress_img">Compress Image</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- STAGE 3: EXECUTE -->
                    <div class="action-area">
                        <button type="submit" class="btn-execute">EXECUTE TRANSMUTATION</button>
                    </div>

                </form>
            </div>
        </section>

        <!-- AdSense Slot -->
        <section class="ad-container">
            <p class="ad-label">ADVERTISEMENT</p>
            <div class="ad-placeholder"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Aether Engine | Built by an IT Student @ EDUVOS</p>
            <div class="donation-link">
                <a href="https://www.buymeacoffee.com/yourlink" target="_blank" class="coffee-btn">☕ Buy me a $1 Coffee</a>
            </div>
        </div>
    </footer>

</body>
</html>
